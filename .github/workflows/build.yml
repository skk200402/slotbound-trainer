# 每次推送 / PR：编便携版，上传成构建产物（Actions 页面下载 zip）。
# 推 v* 标签（例如 v0.2.0）：同时发 GitHub Release，直接附上 exe。
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # 只有打标签发 Release 时用得到

jobs:
  build:
    # 固定 2022 镜像：build.ps1 用的是 "Visual Studio 17 2022" 生成器
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Build dev tools (DLL + CLI) and portable package
        shell: pwsh
        run: |
          ./build.ps1
          ./build.ps1 -Dist

      - name: Name the package
        id: pkg
        shell: pwsh
        run: |
          $ver = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { "dev-$('${{ github.sha }}'.Substring(0, 7))" }
          "name=slotbound-trainer-$ver" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            dist/slotbound_trainer.exe
            build/Release/*.dll
            build/Release/*.exe
          if-no-files-found: warn

      - name: Publish release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' dist/slotbound_trainer.exe --title '${{ github.ref_name }}' --generate-notes
